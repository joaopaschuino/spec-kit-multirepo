schema_version: "1.0"
workflow:
  id: "multi-repo"
  name: "Multi-Repo Implementation"
  version: "0.7.0"
  author: "Joao Victor"
  description: "Dispatches implementation of a centrally-specified feature to workspace member repositories in dependency order"

requires:
  speckit_version: ">=1.1.0"

inputs:
  feature:
    type: string
    required: false
    prompt: "Feature directory (relative to the project root or absolute); defaults to the active feature"
  dry_run:
    type: string
    required: false
    prompt: "Set to true to report member readiness and waves without dispatching anything"
  missing:
    type: string
    required: false
    prompt: "How to treat participants missing locally: error (default, aborts) or skip (dispatch the ready members)"
  verify_retries:
    type: string
    required: false
    prompt: "Re-dispatches per member after a failed verification, with the failure log attached (default 0)"
  dispatch_timeout:
    type: string
    required: false
    prompt: "Seconds before a member dispatch or verification command is killed (default 3600; applies to sequential and parallel waves)"
  confirm:
    type: string
    required: false
    prompt: "Pre-approval for the confirm gate (approve/reject); when omitted and attached to a TTY, the gate prompts interactively"
  review:
    type: string
    required: false
    prompt: "Pre-approval for the review gate (approve/reject); when omitted and attached to a TTY, the gate prompts interactively"

steps:
  - id: confirm
    type: gate
    message: "Dispatch implementation to the workspace members in dependency order?"
    options: [approve, reject]
    on_reject: abort
    verdict_input: confirm

  - id: implement
    type: multi-repo-implement
    feature: "{{ inputs.feature }}"
    dry_run: "{{ inputs.dry_run }}"
    missing: "{{ inputs.missing }}"
    verify_retries: "{{ inputs.verify_retries }}"
    dispatch_timeout: "{{ inputs.dispatch_timeout }}"

  - id: review
    type: gate
    message: "Member dispatch finished. Objective verification — {{ steps.implement.output.verification_summary }}. Review the verification report before completing the run."
    show_file: "{{ steps.implement.output.verification_report }}"
    options: [approve, reject]
    on_reject: abort
    verdict_input: review
